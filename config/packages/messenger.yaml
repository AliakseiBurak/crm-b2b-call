framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'
            # scheduler_default is provided by #[AsSchedule('default')].
            # Consume with: php bin/console messenger:consume scheduler_default

        routing:
            # SendCampaignBatch is produced by Symfony Scheduler — do not route it
            # to sync/async. The scheduler transport yields it on each tick.

